name: Nahfunk (Android)

on:
  push:
    branches: [main]
    paths:
      - 'nahfunk/**'
      - '.github/workflows/nahfunk-android.yml'
  pull_request:
    paths:
      - 'nahfunk/**'
      - '.github/workflows/nahfunk-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nahfunk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests + APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nahfunk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Release-APK bauen
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: APK benennen
        id: apk
        run: |
          VERSION="2.0.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "nahfunk-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "nahfunk.apk"
          echo "file=nahfunk-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Test-Ergebnisse sichern
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nahfunk-test-results
          path: nahfunk/app/build/reports/tests/
          retention-days: 7

      - name: APK als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: nahfunk-apk
          path: nahfunk/${{ steps.apk.outputs.file }}
          retention-days: 30

      - name: Testversion veröffentlichen (Branches und Pull Requests)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nahfunk-test
          name: Nahfunk – Testversion ${{ steps.apk.outputs.version }}
          prerelease: true
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          body: |
            Automatisch gebaute **Testversion** aus `${{ github.head_ref || github.ref_name }}`.

            Auf dem Handy `nahfunk.apk` herunterladen, öffnen und installieren
            (beim ersten Mal „Installation aus dieser Quelle erlauben“).
            Updates gehen ohne Deinstallation, die Signatur bleibt gleich.
          files: nahfunk/nahfunk.apk

      - name: Aktuelle Version veröffentlichen (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nahfunk-latest
          name: Nahfunk ${{ steps.apk.outputs.version }}
          body: |
            Aktuelle **Nahfunk**-Version, automatisch aus `main` gebaut.

            Auf dem Handy `nahfunk.apk` herunterladen, öffnen und installieren
            (beim ersten Mal „Installation aus dieser Quelle erlauben“).
            Updates gehen ohne Deinstallation, die Signatur bleibt gleich.
          files: nahfunk/nahfunk.apk
