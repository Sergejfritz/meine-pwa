name: Imposter APK

on:
  push:
    branches: [main]
    paths: ['imposter/**', 'android-imposter/**', '.github/workflows/apk.yml']
  pull_request:
    paths: ['imposter/**', 'android-imposter/**', '.github/workflows/apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android-SDK-Pakete
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: APK bauen
        working-directory: android-imposter
        run: gradle assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Imposter-apk
          path: android-imposter/app/build/outputs/apk/release/app-release.apk
