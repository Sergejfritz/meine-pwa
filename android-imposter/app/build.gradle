plugins { id 'com.android.application' }

android {
    namespace 'de.sfritz.imposter'
    compileSdk 35

    defaultConfig {
        applicationId 'de.sfritz.imposter'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '2.1'
    }

    signingConfigs {
        release {
            // Schlüssel nur zum Selbst-Installieren (Sideload), nicht für den Play Store.
            storeFile file('../imposter.keystore')
            storePassword 'imposter'
            keyAlias 'imposter'
            keyPassword 'imposter'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // Die Web-App aus /imposter wird direkt als Asset eingebunden.
    // Mit -PwwwDir=/pfad kann ein anderer Ordner verwendet werden (z. B. mit eigenen Fotos & Musik).
    sourceSets { main { assets.srcDirs = [project.findProperty('wwwDir') ?: '../../imposter'] } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
